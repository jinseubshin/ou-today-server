<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>체험팩 신청 완료 | O.U 오늘의 유정란</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .complete-container { min-height: 100vh; padding: 6rem 2rem 4rem; background: #FAFAFA; display: flex; align-items: center; justify-content: center; }
    .complete-card { max-width: 540px; width: 100%; background: white; border-radius: 24px; padding: 3rem 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--warm-yellow); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 2rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .success-icon { font-size: 4rem; margin-bottom: 1rem; }
    .complete-title { font-size: 2rem; font-weight: 900; color: var(--deep-green); margin-bottom: 0.8rem; }
    .complete-subtitle { font-size: 1.1rem; color: var(--text-gray); margin-bottom: 2rem; line-height: 1.6; }
    .order-summary { background: var(--light-bg); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; text-align: left; }
    .order-row { display: flex; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid #e0e0e0; font-size: 0.95rem; }
    .order-row:last-child { border-bottom: none; }
    .order-label { color: var(--text-gray); font-weight: 600; }
    .order-value { color: var(--text-dark); font-weight: 700; }
    .cta-box { background: linear-gradient(135deg, #f9f3e3, #fff8e1); border: 2px solid var(--warm-yellow); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
    .cta-box p { margin: 0 0 1rem; color: var(--text-dark); font-size: 0.95rem; line-height: 1.7; }
    .btn-subscribe { display: inline-block; background: var(--deep-green); color: white; padding: 1rem 2rem; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 1rem; transition: all 0.3s; }
    .btn-subscribe:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
    .btn-home { display: block; margin-top: 1.2rem; color: var(--text-gray); text-decoration: none; font-size: 0.95rem; }
    .btn-home:hover { color: var(--deep-green); }
    .error-box { background: #fff0f0; border: 2px solid #ff6b6b; border-radius: 16px; padding: 1.5rem; color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="https://www.genspark.ai/api/files/s/Fbqdj55M" alt="O.U 오늘의 유정란" style="height: 40px; width: auto;">
        <span class="logo-text">오늘의 유정란 <span style="color: var(--text-gray); font-size: 0.75em; font-weight: 500;">| 구독 서비스</span></span>
      </a>
    </div>
  </header>

  <section class="complete-container">
    <div class="complete-card" id="loadingState">
      <div class="spinner"></div>
      <p style="color: var(--text-gray);">결제를 확인하고 있습니다...</p>
    </div>

    <div class="complete-card" id="successState" style="display:none;">
      <div class="success-icon">🥚</div>
      <h1 class="complete-title">신청 완료!</h1>
      <p class="complete-subtitle">체험팩 주문이 완료되었습니다.<br>1~3 영업일 내 발송될 예정이에요.</p>

      <div class="order-summary">
        <div class="order-row">
          <span class="order-label">상품</span>
          <span class="order-value">유정란 체험팩 8구</span>
        </div>
        <div class="order-row">
          <span class="order-label">결제 금액</span>
          <span class="order-value">9,900원</span>
        </div>
        <div class="order-row">
          <span class="order-label">배송지</span>
          <span class="order-value" id="deliveryAddr">-</span>
        </div>
        <div class="order-row">
          <span class="order-label">주문번호</span>
          <span class="order-value" id="orderIdDisplay" style="font-size:0.85rem;">-</span>
        </div>
      </div>

      <div class="cta-box">
        <p>✨ <strong>체험팩이 마음에 드셨나요?</strong><br>
        정기구독 첫 달은 <strong>10% 할인</strong>된 가격으로 시작하실 수 있어요!</p>
        <a href="subscription.html" class="btn-subscribe">정기구독 알아보기 →</a>
      </div>

      <a href="index.html" class="btn-home">← 홈으로 돌아가기</a>
    </div>

    <div class="complete-card" id="errorState" style="display:none;">
      <div class="success-icon">😥</div>
      <h1 class="complete-title" style="color:#c0392b;">결제 확인 실패</h1>
      <div class="error-box">
        <p id="errorMessage">결제 확인 중 오류가 발생했습니다.</p>
      </div>
      <a href="trial.html" class="btn-subscribe" style="display:inline-block; margin-top:1.5rem; background:var(--warm-yellow); color:var(--text-dark);">다시 시도하기</a>
      <a href="index.html" class="btn-home">홈으로 돌아가기</a>
    </div>
  </section>

  <script>
    const BACKEND_URL = "https://ou-today-server.onrender.com";

    async function confirmPayment() {
      const params     = new URLSearchParams(window.location.search);
      const paymentKey = params.get('paymentKey');
      const orderId    = params.get('orderId');
      const amount     = params.get('amount');

      if (!paymentKey || !orderId || !amount) {
        showError('결제 정보가 올바르지 않습니다.');
        return;
      }

      const trialData = JSON.parse(localStorage.getItem('ou_trial_data') || '{}');
      const kakaoId   = localStorage.getItem('kakao_id') || 'guest';

      try {
        const res = await fetch(`${BACKEND_URL}/api/payment/confirm-onetime`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paymentKey,
            orderId,
            amount:       parseInt(amount),
            paymentType:  'trial',
            kakaoId,
            delivery:     trialData.delivery || {},
            orderName:    'O.U 유정란 체험팩 8구',
            userName:     localStorage.getItem('user_nickname') || localStorage.getItem('user_name') || '고객',
            userEmail:    localStorage.getItem('user_email') || ''
          })
        });

        const data = await res.json();

        if (data.status === 'ok') {
          // 성공
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('successState').style.display = 'block';
          document.getElementById('deliveryAddr').textContent = trialData.delivery?.address || '-';
          document.getElementById('orderIdDisplay').textContent = orderId;
          localStorage.removeItem('ou_trial_data');
        } else {
          showError(data.error || '결제 확인에 실패했습니다.');
        }

      } catch (e) {
        console.error(e);
        showError('서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    }

    function showError(msg) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display   = 'block';
      document.getElementById('errorMessage').textContent   = msg;
    }

    window.addEventListener('load', confirmPayment);
  </script>
</body>
</html>
